name: 🤖 Arbitrage Bot (5-min Scan)

on:
  schedule:
    # FIX 1: Every 5 minutes — GitHub's actual minimum (*/1 was throttled, avg 66min gap).
    # FIX 3: Telegram sent every run — no throttle needed since each run is 5+ min apart.
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: arbitrage-bot
  cancel-in-progress: true

jobs:
  scan:
    name: Arbitrage Scan
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write   # Needed for git push of arb_state.json

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "scripts/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Configure Git (for state persistence via git commit)
        run: |
          git config --global user.name  "Arb Bot"
          git config --global user.email "arb-bot@users.noreply.github.com"

      - name: Run Arbitrage Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          PAPER_BALANCE:      "10000.0"
          MIN_PROFIT_PCT:     "0.001"
          MAX_TRADE_PCT:      "0.02"
          STOP_LOSS_PCT:      "0.10"
        run: python scripts/cron_arbitrage.py
