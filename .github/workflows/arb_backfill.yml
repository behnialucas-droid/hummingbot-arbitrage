name: 📊 Arbitrage Backfill (5-Day History)

on:
  workflow_dispatch:   # Manual trigger only — run once to see missed opportunities

jobs:
  backfill:
    name: Historical Opportunity Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15   # OHLCV fetch from 11 exchanges can take a few minutes

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "scripts/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run 5-Day Backfill Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/arb_backfill.py
